spring:
  application:
    name: interviewprep-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/interviewprep}
      database: ${MONGODB_DATABASE:interviewprep}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import: optional:file:.env[.properties]

server:
  port: ${PORT:5000}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

app:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:60000}
    max-retries: ${AI_MAX_RETRIES:0}
    max-prompt-length: ${AI_MAX_PROMPT_LENGTH:6000}
    max-system-prompt-length: ${AI_MAX_SYSTEM_PROMPT_LENGTH:2000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8192}
  jwt:
    secret: ${JWT_SECRET:interviewprep-super-secret-key-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://raswatigithub.github.io}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    ai-requests-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:12}
    general-requests-per-minute: ${GENERAL_RATE_LIMIT_PER_MINUTE:120}

logging:
  level:
    root: INFO
    com.interviewprep.backend: INFO
